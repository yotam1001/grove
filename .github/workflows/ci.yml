name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    name: Windows build, tests and offline review
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/check_public_files.py
      - name: Shared crates match the pinned Tide commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_shared_crates.py check --upstream
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy for the playback crate's opt-in YouTube path
        run: cargo clippy --locked --package tide-playback --features youtube --all-targets -- -D warnings
      - run: cargo build --locked --package grove-music
      - name: Offline review modes (no Spotify, credentials or preference writes)
        shell: pwsh
        run: |
          $exe = 'target/debug/grove-music.exe'
          foreach ($mode in @('--smoke-ui', '--review-features', '--review-ui')) {
            $out = Join-Path 'review' $mode.TrimStart('-')
            $run = Start-Process -FilePath $exe -ArgumentList @($mode, $out) -Wait -PassThru -NoNewWindow
            if ($run.ExitCode -ne 0) { throw "$mode exited with $($run.ExitCode)" }
          }
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grove-screenshots-${{ github.event.pull_request.number || github.sha }}
          path: review/
          if-no-files-found: warn
          retention-days: 14
      - name: Installer and package tests
        run: python scripts/test_grove_beta.py

  portable:
    # Issue #11: Linux and macOS build, test, run the offline review modes and
    # package a portable preview. Real-hardware checks (sign-in, Premium audio,
    # media keys, mpv local files) are still pending, so this never blocks a merge.
    name: ${{ matrix.name }} build, tests, review and portable package (non-blocking)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            package: linux-x86_64
          - os: macos-latest
            name: macOS
            package: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev             libdbus-1-dev libx11-xcb1 libxcursor1 libxrandr2 libxi6 libgl1 pkg-config xvfb fonts-dejavu-core
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --package grove-music
      - name: Offline review modes (no Spotify, credentials or preference writes)
        shell: bash
        run: |
          exe=target/release/grove-music
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1600x1000x24" "$@"; else "$@"; fi; }
          for mode in --smoke-ui --review-features --review-ui; do
            echo "::group::$mode"
            run "$exe" "$mode" "review/${mode#--}"
            echo "::endgroup::"
          done
      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grove-screenshots-${{ matrix.package }}-${{ github.event.pull_request.number || github.sha }}
          path: review/
          if-no-files-found: warn
          retention-days: 14
      - name: Portable package
        shell: bash
        run: |
          name=grove-${{ matrix.package }}-portable
          mkdir -p "dist/$name" .local
          cargo metadata --locked --filter-platform "$(rustc -vV | sed -n 's/^host: //p')" --format-version 1 > .local/metadata.json
          python3 scripts/generate-dependency-notices.py .local/metadata.json "dist/$name/DEPENDENCIES.md"
          cp target/release/grove-music LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          cp docs/grove/PORTABLE.md "dist/$name/README.md"
          (cd "dist/$name" && shasum -a 256 grove-music LICENSE THIRD_PARTY_NOTICES.md DEPENDENCIES.md README.md > SHA256SUMS.txt)
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: grove-${{ matrix.package }}-portable-${{ github.event.pull_request.number || github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
