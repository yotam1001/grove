[package]
name = "tide-playback"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Tide's YouTube path: yt-dlp through mpv, next-song stream preparation and
# signed-in cookie copies. Grove plays only local files, so it stays off.
youtube = []

[[example]]
name = "transition"
required-features = ["youtube"]

[dependencies]
serde_json = "1"
tide-core = { path = "../core" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
